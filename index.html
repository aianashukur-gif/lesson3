<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Заявка на комнату</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">Заявка на комнату в общежитии</h1>

    <form id="roomForm">

        <div class="mb-3">
            <label for="studentId" class="form-label">
                ID студента
            </label>

            <input
                type="number"
                class="form-control"
                id="studentId"
                required
            >
        </div>


        <div class="mb-3">
            <label for="buildingId" class="form-label">
                Номер корпуса
            </label>

            <input
                type="number"
                class="form-control"
                id="buildingId"
                required
            >
        </div>


        <div class="mb-3">
            <label for="roomNumber" class="form-label">
                Номер комнаты
            </label>

            <input
                type="number"
                class="form-control"
                id="roomNumber"
                required
            >
        </div>


        <button type="submit" class="btn btn-primary">
            Проверить заявку
        </button>

    </form>


    <div id="loading" class="mt-3"></div>

    <div id="result" class="mt-3"></div>

</div>


<script src="myscript.js"></script>

</body>
</html>
